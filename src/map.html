<body id="root" class="text-sm invisible bg-default-background">
    <script>0</script>

    <div id="app" style="padding: 0 4%;">

        <style>
            label,
            button {
                font-family: 'Lato', sans-serif;
                display: block;
            }
        </style>

        <form id="district-lookup" style="margin-top: 100px;" method="post">


            <label>Enter Addresses (one per line):</label>
            <textarea id="addresses" name="addresses" rows="10" cols="25">118 NW Jackson Ave. Corvallis, Oregon 97330</textarea>

            <button style="padding:10px; font-size:larger; margin-top:5px;" id="show-district" type="submit">Submit</button>

            <div id="result"></div>
        </form>
    </div>

    <div class="column main">


        <div class="content">

            <script>

                domReady(async function()
                {
                    let form = document.getElementById('district-lookup');
                    form.addEventListener('submit', async function(event)
                    {

                        let action = event.submitter.id;
                        event.preventDefault(); // Prevent form submissi
                        event.stopPropagation();
                        let addresses = document.getElementById('addresses').value.split('\n');
                        let resultDiv = document.getElementById('result');
                        let statusMessage = "Checking...";
                        let messages = [];

                        resultDiv.textContent = statusMessage;

                        // Geocode right away so we can determine which quadrant to start the district search in.
                        let geocodes = await Promise.all(addresses.map(address => geocodeAddress(address)));
                        // console.log('Geocoded Address LatLng:', addressLatLng);


                        for (let addressLatLng of geocodes) {

                            let district = await getDistrict(addressLatLng);
                            messages.push(district);
                        }

                        resultDiv.textContent = messages.join('\n');
                    });
                });




                // User wants to find which district the address is in.
                async function getDistrict(addressLatLng)
                {

                    let search = await fetch(`/kml/house/parse-districts?lat=${addressLatLng.lat()}&lng=${addressLatLng.lng()}`).then(res => res.json());
                    console.log('Search results:', search);

                    for (let district of search) {
                        if (await isLatLngInDistrict(addressLatLng, district)) {
                            return district.id;
                        }
                    }
                }





                // 1. Geocode the Address (assuming you have a geocoding service or API call)
                async function geocodeAddress(address)
                {
                    const geocoder = new google.maps.Geocoder();
                    return await new Promise((resolve, reject) =>
                    {
                        geocoder.geocode({ 'address': address }, (results, status) =>
                        {
                            if (status === 'OK') {
                                resolve(results[0].geometry.location); // Returns LatLng object
                            } else {
                                reject('Geocode was not successful for the following reason: ' + status);
                            }
                        });
                    });
                }




                // Main function to check if address is inside polygon
                async function isLatLngInDistrict(addressLatLng, district)
                {
                    try {

                        const kmlPolygon = new google.maps.Polygon({ paths: district.googleKmlPolygon }); // Load KML polygon for district
                        // 4. Use containsLocation()
                        return google.maps.geometry.poly.containsLocation(addressLatLng, kmlPolygon);

                    } catch (error) {
                        console.error('Error:', error);
                        return false;
                    }
                }

            </script>
