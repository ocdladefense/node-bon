        <form id="district-lookup" style="margin-top: 100px;" method="post">


            <label style="font-size: larger;" for="address">Enter Address:</label>
            <input style="padding:10px; font-size:larger;" type="text" id="address" name="address" value="118 NW Jackson Ave. Corvallis, Oregon 97330" style="" size="60" />

            <div id="result"></div>

    <div class="column main">


        <div class="content">

            <script>

                domReady(function() {
                    let form = document.getElementById('district-lookup');
                    form.addEventListener('submit', async function(event) {
                        event.preventDefault(); // Prevent form submissi
                        event.stopPropagation();
                        let address = document.getElementById('address').value;
                        let resultDiv = document.getElementById('result');
                        resultDiv.textContent = 'Checking...';

                        try {
                            let isInside = await isAddressInPolygon(address);
                            resultDiv.textContent = isInside ? 'The address is inside the district.' : 'The address is outside the district.';
                        } catch (error) {
                            resultDiv.textContent = 'Error: ' + error.message;
                        }
                    });
                })

                async function loadKmlPolygon(district = "16") {
                    let kmlOptions = {};


                    // 2. & 3. Load KML and Create Polygon (simplified, assuming polygon coordinates are extracted)
                    // In a real scenario, you'd parse your KML to get these paths.
                    const kmlPolygonPath = await fetch(`/kml/house/${district}`).then(res => res.json()); // Example endpoint returning polygon coordinates

                    return new google.maps.Polygon({ paths: kmlPolygonPath });
                }


                // 1. Geocode the Address (assuming you have a geocoding service or API call)
                async function geocodeAddress(address) {
                    const geocoder = new google.maps.Geocoder();
                    return await new Promise((resolve, reject) => {
                        geocoder.geocode({ 'address': address }, (results, status) => {
                            if (status === 'OK') {
                                resolve(results[0].geometry.location); // Returns LatLng object
                            } else {
                                reject('Geocode was not successful for the following reason: ' + status);
                            }
                        });
                    });
                }



                window.loadKmlPolygon = loadKmlPolygon;
                window.getPolygon = async function() {
                    return await isAddressInPolygon("118 NW Jackson Ave. Corvallis, Oregon 97330");
                };


                // Main function to check if address is inside polygon
                async function isAddressInPolygon(address) {
                    try {
                        const addressLatLng = await geocodeAddress(address);
                        const kmlPolygon = await loadKmlPolygon("16"); // Load KML polygon for district 16
                        // 4. Use containsLocation()
                        const isInside = google.maps.geometry.poly.containsLocation(addressLatLng, kmlPolygon);

                        // 5. Interpret the Result
                        if (isInside) {
                            console.log(`The address "${address}" is inside the KML polygon.`);
                            return true;
                        } else {
                            console.log(`The address "${address}" is outside the KML polygon.`);
                            return false;
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        return false;
                    }
                }

                // Usage example
                // isAddressInKMLPolygon("1600 Amphitheatre Parkway, Mountain View, CA");
            </script>
